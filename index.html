<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Record Search</title>

<style>

body{
  font-family:Arial;
  text-align:center;
  margin-top:80px;
}

.logo{
  font-size:50px;
  font-weight:bold;
  margin-bottom:30px;
  color:#4285F4;
}

.search-box{
  width:600px;
  max-width:90%;
  padding:15px;
  border-radius:30px;
  border:1px solid #ddd;
  font-size:18px;
}

.result{
  width:700px;
  max-width:90%;
  margin:20px auto;
  text-align:left;
  border-bottom:1px solid #eee;
  padding-bottom:15px;
}

.title{
  color:#1a0dab;
  font-size:20px;
}

.desc{
  color:#4d5156;
}

</style>

</head>

<body>

<div class="logo">
  Track Record Search
</div>

<input
  type="text"
  id="search"
  class="search-box"
  placeholder="Cari data..."
>

<div id="results"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyp6FbYAKJqRnwqTIq_k6kQf9nVgsY1ACrbzDOxDYUiirvIk1Ho5hY6a5mzq_hnWEIZ/exec";

document
.getElementById("search")
.addEventListener("keyup", function(){

    const keyword = this.value;

    if(keyword.length < 1){
        document.getElementById("results").innerHTML = "";
        return;
    }

    const oldScript = document.getElementById("jsonp");

    if(oldScript){
      oldScript.remove();
    }

    const script = document.createElement("script");

    script.id = "jsonp";

    script.src =
      API_URL +
      "?q=" +
      encodeURIComponent(keyword) +
      "&callback=handleResults";

    document.body.appendChild(script);

});

function handleResults(data){

    let html = "";

    data.forEach(item => {

        html += `
          <div class="result">

            <div class="title">
              ${item.no_sppb}
            </div>

            <div class="desc">
              ${item.uraian}
            </div>

            <small>
              Nilai: ${item.nilai}
              |
              Status: ${item.status}
              |
              Tanggal: ${item.tanggal}
            </small>

          </div>
        `;

    });

    document.getElementById("results").innerHTML = html;

}

</script>

</body>
</html>
