<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tracking SPPb</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --primary:#0B3040;
  --blue:#0B57D0;
  --bg:#f3f7fb;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#1e293b;
  --muted:#64748b;
  --success-bg:#dcfce7;
  --success-text:#15803d;
  --shadow:0 10px 30px rgba(15,23,42,.06);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(
    180deg,
    #f7f9fc 0%,
    #eef3f8 100%
  );
  min-height:100vh;
  color:var(--text);
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:70px 20px 50px;
}

.header{
  text-align:center;
  margin-bottom:45px;
}

.logo{
  font-size:52px;
  font-weight:700;
  color:var(--primary);
  letter-spacing:-2px;
  margin-bottom:12px;
}

.subtitle{
  color:var(--muted);
  font-size:18px;
}

.search-wrapper{
  display:flex;
  justify-content:center;
  margin-bottom:25px;
}

.search-box{
  width:100%;
  max-width:820px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px 24px;
  display:flex;
  align-items:center;
  gap:14px;
  transition:.25s ease;
  box-shadow:var(--shadow);
}

.search-box:focus-within{
  transform:translateY(-2px);
  border-color:var(--blue);
  box-shadow:
    0 20px 45px rgba(11,87,208,.12);
}

.search-icon{
  font-size:22px;
  color:#94a3b8;
}

.search-input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  font-size:17px;
  color:#111827;
}

.search-input::placeholder{
  color:#94a3b8;
}

.loading{
  width:24px;
  height:24px;
  border:3px solid #dbeafe;
  border-top:3px solid var(--blue);
  border-radius:50%;
  animation:spin 1s linear infinite;
  display:none;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.stats{
  margin:15px 5px 25px;
  color:var(--muted);
  font-size:14px;
}

.result{
  background:var(--card);
  border-radius:22px;
  padding:26px;
  margin-bottom:22px;
  border:1px solid var(--border);
  transition:.25s ease;
  box-shadow:
    0 5px 20px rgba(15,23,42,.04);
}

.result:hover{
  transform:translateY(-3px);
  box-shadow:
    0 20px 40px rgba(15,23,42,.08);
}

.result-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:14px;
  flex-wrap:wrap;
}

.title{
  font-size:21px;
  font-weight:700;
  color:var(--blue);
  word-break:break-word;
}

.badge{
  background:var(--success-bg);
  color:var(--success-text);
  padding:8px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

.desc{
  color:#475569;
  line-height:1.8;
  margin-bottom:18px;
  font-size:15px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.meta-item{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 15px;
  font-size:13px;
  color:#475569;
}

.empty{
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
  font-size:17px;
}

mark{
  background:#fef08a;
  padding:2px 4px;
  border-radius:5px;
}

.footer{
  text-align:center;
  margin-top:55px;
  color:#94a3b8;
  font-size:13px;
}

.error{
  background:#fee2e2;
  color:#b91c1c;
  padding:16px;
  border-radius:14px;
  text-align:center;
}

@media(max-width:768px){

  .container{
    padding-top:45px;
  }

  .logo{
    font-size:38px;
  }

  .subtitle{
    font-size:15px;
  }

  .search-box{
    border-radius:18px;
    padding:15px 18px;
  }

  .search-input{
    font-size:15px;
  }

  .result{
    padding:20px;
  }

  .title{
    font-size:18px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      Tracking SPPb
    </div>

    <div class="subtitle">
      Sistem pencarian dokumen & tracking data SPPb
    </div>

  </div>

  <div class="search-wrapper">

    <div class="search-box">

      <div class="search-icon">
        🔍
      </div>

      <input
        type="text"
        id="search"
        class="search-input"
        placeholder="Cari nomor SPPb, uraian, status..."
        autocomplete="off"
      >

      <div class="loading" id="loading"></div>

    </div>

  </div>

  <div id="stats" class="stats"></div>

  <div id="results"></div>

  <div class="footer">
    Tracking SPPb • Powered by Google Spreadsheet
  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxKpb7C1qrQzZ16ZPh0QlzmHhHrAVTBHX8XzzbsdVoOeBwvU79ArrY_anSe-kiy0QTO/exec";

const searchInput = document.getElementById("search");
const resultsDiv = document.getElementById("results");
const statsDiv = document.getElementById("stats");
const loading = document.getElementById("loading");

let debounceTimer;

searchInput.addEventListener("keyup", function(){

    clearTimeout(debounceTimer);

    const keyword = this.value.trim();

    if(keyword.length < 1){

        statsDiv.innerHTML = "";

        resultsDiv.innerHTML = `
          <div class="empty">
            Mulai ketik untuk mencari data...
          </div>
        `;

        return;
    }

    debounceTimer = setTimeout(() => {
      searchData(keyword);
    }, 400);

});

function searchData(keyword){

    loading.style.display = "block";

    const oldScript =
      document.getElementById("jsonp");

    if(oldScript){
      oldScript.remove();
    }

    const script =
      document.createElement("script");

    script.id = "jsonp";

    script.src =
      API_URL +
      "?q=" +
      encodeURIComponent(keyword) +
      "&callback=handleResults";

    script.onerror = function(){

      loading.style.display = "none";

      resultsDiv.innerHTML = `
        <div class="error">
          Gagal mengambil data dari server
        </div>
      `;

    };

    document.body.appendChild(script);

}

function handleResults(data){

    loading.style.display = "none";

    const keyword =
      searchInput.value.trim();

    let html = "";

    if(!Array.isArray(data) || data.length === 0){

        statsDiv.innerHTML =
          "0 hasil ditemukan";

        resultsDiv.innerHTML = `
          <div class="empty">
            Tidak ada data ditemukan
          </div>
        `;

        return;
    }

    statsDiv.innerHTML =
      `${data.length} hasil ditemukan`;

    data.forEach(item => {

        const title =
          highlight(item.no_sppb || "-", keyword);

        const desc =
          highlight(item.uraian || "-", keyword);

        const status =
          item.status || "Tidak ada status";

        const nilai =
          item.nilai || 0;

        const tanggal =
          item.tanggal || "-";

        html += `
          <div class="result">

            <div class="result-top">

              <div class="title">
                ${title}
              </div>

              <div class="badge">
                ${status}
              </div>

            </div>

            <div class="desc">
              ${desc}
            </div>

            <div class="meta">

              <div class="meta-item">
                💰 Nilai :
                <strong>
                  Rp ${formatNumber(nilai)}
                </strong>
              </div>

              <div class="meta-item">
                📅 ${formatDate(tanggal)}
              </div>

            </div>

          </div>
        `;

    });

    resultsDiv.innerHTML = html;

}

function highlight(text, keyword){

    if(!keyword) return text;

    const regex =
      new RegExp(`(${escapeRegex(keyword)})`, "gi");

    return text.replace(
      regex,
      "<mark>$1</mark>"
    );

}

function escapeRegex(text){

    return text.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

}

function formatNumber(number){

    return new Intl.NumberFormat(
      "id-ID"
    ).format(Number(number));

}

function formatDate(dateString){

    if(!dateString) return "-";

    const date = new Date(dateString);

    if(isNaN(date)){
      return dateString;
    }

    return new Intl.DateTimeFormat(
      "id-ID",
      {
        day:"2-digit",
        month:"long",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    ).format(date);

}

resultsDiv.innerHTML = `
  <div class="empty">
    Mulai ketik untuk mencari data...
  </div>
`;

</script>

</body>
</html>
